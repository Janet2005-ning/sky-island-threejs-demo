<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="低模卡通天空岛 3D 网页模型，可浏览和漫游。"
    />
    <title>低模天空岛漫游</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-mode="browse">
    <main id="app" aria-label="低模卡通天空岛 3D 场景"></main>
    <div class="vignette" aria-hidden="true"></div>
    <div id="loader-status" role="status" aria-label="正在加载"></div>

    <aside class="hud" aria-live="polite">
      <div class="mode-panel">
        <span class="label">模式</span>
        <strong id="mode-label">浏览</strong>
      </div>

      <nav class="toolbar" aria-label="场景模式">
        <button id="browse-mode" class="tool-button icon-only-button" type="button" aria-label="浏览" aria-pressed="true">
          ◎
        </button>
        <button id="roam-mode" class="tool-button icon-only-button" type="button" aria-label="漫游" aria-pressed="false">
          ✦
        </button>
        <button
          id="fountain-animation"
          class="tool-button fountain-button icon-only-button"
          type="button"
          data-state="loading"
          aria-label="唤醒泉水"
          aria-keyshortcuts="F"
          disabled
        >
          ♒
        </button>
        <button id="reset-camera" class="icon-button" type="button" aria-label="重置视角">
          ↺
        </button>
      </nav>
    </aside>

    <section id="bridge-puzzle-panel" class="bridge-puzzle-panel" aria-live="polite">
      <div class="bridge-puzzle-heading">
        <span class="label">积木桥</span>
        <strong id="bridge-progress">0 / 6</strong>
      </div>
      <p id="bridge-message">顺序：蓝 → 绿 → 粉 → 黄 → 橙 → 红</p>
    </section>

    <div id="bridge-crosshair" class="bridge-crosshair" aria-hidden="true">
      <span></span>
    </div>

    <section id="vr-hand-hud" class="vr-hand-hud" aria-live="polite" aria-label="VR 模拟手状态">
      <div class="vr-hand-status" data-hand="left" data-state="idle">
        <span>左键 · 左手</span>
        <strong id="vr-left-status">按住移动射线</strong>
      </div>
      <div class="vr-hand-status" data-hand="right" data-state="idle">
        <span>右键 · 右手</span>
        <strong id="vr-right-status">按住移动射线</strong>
      </div>
    </section>

    <div id="move-pad" class="move-pad" hidden aria-label="移动">
      <button class="pad-button pad-up" type="button" data-move="forward" aria-label="前进">
        ↑
      </button>
      <button class="pad-button pad-left" type="button" data-move="left" aria-label="左移">
        ←
      </button>
      <button class="pad-button pad-down" type="button" data-move="back" aria-label="后退">
        ↓
      </button>
      <button class="pad-button pad-right" type="button" data-move="right" aria-label="右移">
        →
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
